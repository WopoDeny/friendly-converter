[package]
name = "friendly-converter"
version = "0.1.0"
edition = "2021"
description = "Friendly Converter: fast offline desktop file converter"
license = "MIT"
build = "build.rs"

[lib]
name = "friendly_converter"
path = "src/lib.rs"

[[bin]]
name = "FriendlyConverter"
path = "src/main.rs"

[dependencies]
# GUI
eframe = "0.29"
rfd = "0.15"

# Images
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff", "ico", "tga"] }

# PDF
lopdf = "0.34"
pdf-extract = "0.7"
ttf-parser = "0.24"
flate2 = "1"

# Office / markup
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"
pulldown-cmark = { version = "0.12", default-features = false }
calamine = "0.26"
rust_xlsxwriter = "0.79"
csv = "1"

# Data formats
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
toml = { version = "0.8", features = ["preserve_order"] }

# Misc
encoding_rs = "0.8"
base64 = "0.22"
anyhow = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

# Image decoding is painfully slow in debug builds; optimize dependencies even in dev.
[profile.dev.package."*"]
opt-level = 2
